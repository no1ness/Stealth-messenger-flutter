services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.23.0
    restart: unless-stopped
    environment:
      - TZ=UTC
    volumes:
      - ./pb_data:/pb_data
      - ${PB_HOOKS_DIR:-../pb_hooks}:/pb_hooks:ro
    ports:
      - "127.0.0.1:8090:8090"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [pocketbase]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "8443:8443"

  sing-box:
    image: ghcr.io/sagernet/sing-box:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./sing-box/config.template.json:/etc/sing-box/config.template.json:ro
      - ./sing-box/entrypoint.sh:/etc/sing-box/entrypoint.sh:ro
    entrypoint: ["/etc/sing-box/entrypoint.sh"]
    environment:
      - VLESS_UUID=${VLESS_UUID}
      - VLESS_PRIVATE_KEY=${VLESS_PRIVATE_KEY}
      - VLESS_SHORT_ID=${VLESS_SHORT_ID}
    depends_on: [caddy]

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/certs:/etc/coturn/certs:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

volumes:
  caddy_data:
  caddy_config:
