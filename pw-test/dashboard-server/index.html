<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stealth pw-test Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #1e1b4b;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Abstract shapes in background */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.2) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -150px;
      z-index: -1;
      animation: float 20s infinite alternate;
    }

    body::after {
      background: radial-gradient(circle, rgba(236,72,153,0.15) 0%, rgba(0,0,0,0) 70%);
      top: auto;
      bottom: -200px;
      left: auto;
      right: -200px;
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    header {
      padding: 2rem 4rem;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.05em;
      background: linear-gradient(90deg, #fff, #a5b4fc);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      display: flex;
      flex: 1;
      padding: 2rem 4rem;
      gap: 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    .sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .test-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .test-item {
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .test-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--glass-border);
    }

    .test-item.active {
      background: var(--accent);
      color: #fff;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
      transform: translateY(-1px);
    }

    button:disabled {
      background: #475569;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(255, 255, 255, 0.1);
    }

    .status-badge.running { background: #eab308; color: #422006; animation: pulse 2s infinite; }
    .status-badge.idle { background: #334155; color: var(--text); }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .terminal {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.5rem;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #e2e8f0;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .terminal .success { color: var(--success); }
    .terminal .error { color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <h1>Stealth TestRunner</h1>
    <div id="global-status" class="status-badge idle">Idle</div>
  </header>

  <div class="container">
    <div class="sidebar">
      <div class="card">
        <h2>Test Suites</h2>
        <ul class="test-list" id="test-list">
          <li class="test-item" style="opacity: 0.5;">Loading tests...</li>
        </ul>
      </div>
    </div>

    <div class="main-content">
      <div class="card controls">
        <button id="run-btn" onclick="runTest()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Run Selected Test
        </button>
        <button id="run-all-btn" onclick="runAll()" style="background: rgba(255,255,255,0.1); box-shadow: none;">Run All</button>
      </div>

      <div class="terminal" id="terminal">Welcome to Stealth pw-test dashboard.
Select a test on the left and click Run.</div>
    </div>
  </div>

  <script>
    let selectedTest = null;
    let isRunning = false;
    const term = document.getElementById('terminal');
    const runBtn = document.getElementById('run-btn');
    const runAllBtn = document.getElementById('run-all-btn');
    const statusBadge = document.getElementById('global-status');

    async function fetchTests() {
      try {
        const res = await fetch('/api/tests');
        const data = await res.json();
        const list = document.getElementById('test-list');
        list.innerHTML = '';
        
        data.tests.forEach(test => {
          const li = document.createElement('li');
          li.className = 'test-item';
          li.textContent = test;
          li.onclick = () => selectTest(test, li);
          list.appendChild(li);
        });
      } catch (e) {
        term.innerHTML = `<span class="error">Failed to load tests: ${e.message}</span>`;
      }
    }

    function selectTest(testName, element) {
      if (isRunning) return;
      selectedTest = testName;
      document.querySelectorAll('.test-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
    }

    function updateState(running) {
      isRunning = running;
      runBtn.disabled = running;
      runAllBtn.disabled = running;
      document.querySelectorAll('.test-item').forEach(el => el.style.pointerEvents = running ? 'none' : 'auto');
      statusBadge.className = `status-badge ${running ? 'running' : 'idle'}`;
      statusBadge.textContent = running ? 'Running...' : 'Idle';
    }

    function appendLog(text) {
      const sanitized = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      
      const formatted = sanitized
        .replace(/(passing|✓)/g, '<span class="success">$1</span>')
        .replace(/(failed|✖|Error)/g, '<span class="error">$1</span>');
        
      term.innerHTML += formatted;
      term.scrollTop = term.scrollHeight;
    }

    async function runTest(testFile = selectedTest) {
      if (isRunning) return;
      term.innerHTML = `Starting test: ${testFile || 'ALL'}...\n\n`;
      updateState(true);

      try {
        const response = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ testFile })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          appendLog(decoder.decode(value));
        }
      } catch (err) {
        appendLog(`\n<span class="error">Error: ${err.message}</span>`);
      } finally {
        updateState(false);
      }
    }

    function runAll() {
      selectedTest = null;
      document.querySelectorAll('.test-item').forEach(el => el.classList.remove('active'));
      runTest(null);
    }

    fetchTests();
  </script>
</body>
</html>
