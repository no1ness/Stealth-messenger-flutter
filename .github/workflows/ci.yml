name: CI

on:
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

defaults:
  run:
    working-directory: client

jobs:
  analyze-and-test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Guard - zero Supabase references in code
        working-directory: ${{ github.workspace }}
        run: |
          # Project is local-first: signaling stays on PocketBase only.
          # No external cloud backend may be reintroduced under any name.
          # Scan source/test paths only — historical docs, plans, and
          # this guard's own self-reference are out of scope (task #15
          # archive of .ai-factory/specs/post-pocketbase-hardening.md).
          if git grep -in -e supabase -e Supabase -- 'client/' 'pw-test/'; then
            echo "::error::Cloud backend reference reappeared in code. The project is local-first; signaling stays on PocketBase only. See .ai-factory/rules/base.md and the post-pocketbase-hardening archive (.ai-factory/specs/)."
            exit 1
          fi
          echo "OK: code paths clean (client/, pw-test/)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Validate env files completeness
        run: |
          required_keys="POCKETBASE_URL TURN_URL TURN_USERNAME TURN_PASSWORD TURNS_URL TURNS_USERNAME TURNS_PASSWORD"
          fail=0
          for file in .env.example .env.defaults; do
            missing=""
            for key in $required_keys; do
              grep -qE "^${key}=" "$file" || missing="$missing $key"
            done
            if [ -n "$missing" ]; then
              echo "::error file=client/${file}::missing keys:$missing"
              fail=1
            fi
          done
          exit $fail

      - name: flutter pub get
        run: flutter pub get

      - name: dart format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --coverage --reporter expanded

  pw-test-lint:
    name: pw-test contact-bundle lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint pw-test contact-bundle usage
        working-directory: ${{ github.workspace }}
        run: node pw-test/lint-contact-bundle.mjs

  build-web:
    name: build web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # `.env.defaults` is bundled directly (see pubspec.yaml), so no
      # secrets are needed for CI builds. Real values are injected via
      # `--dart-define=POCKETBASE_URL=...` at deploy time.

      - name: flutter build web --release
        run: flutter build web --release

  build-android:
    name: build android (debug apk)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client/android/gradle/wrapper/gradle-wrapper.properties', 'client/android/**/*.gradle*', 'client/android/**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: flutter build apk --debug
        run: flutter build apk --debug

  # Optional end-to-end signaling smoke test.
  # Always scheduled but the test itself self-skips when the
  # `POCKETBASE_TEST_URL` secret is not configured for the repository
  # (e.g. on forks). The job therefore stays green either way and never
  # blocks merges. Configure the secret in repo settings to enable.
  signaling-smoke:
    name: signaling smoke (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter test signaling smoke
        env:
          POCKETBASE_TEST_URL: ${{ secrets.POCKETBASE_TEST_URL }}
          POCKETBASE_TEST_ADMIN_EMAIL: ${{ secrets.POCKETBASE_TEST_ADMIN_EMAIL }}
          POCKETBASE_TEST_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_TEST_ADMIN_PASSWORD }}
        run: |
          if [ -z "$POCKETBASE_TEST_URL" ]; then
            echo "::notice::POCKETBASE_TEST_URL is not configured for this repo — signaling smoke test skipped"
            exit 0
          fi
          flutter test test/services/signaling/pocketbase_signaling_smoke_test.dart

  # Task #13: signed Android release APK + AAB. Runs nightly (03:00 UTC)
  # and on-demand via `workflow_dispatch`. The build.gradle.kts signing
  # wiring already exists (client/android/app/build.gradle.kts:18-71);
  # this job just bridges secrets into key.properties at runtime.
  # If the keystore secret is missing (e.g. PR from a fork), the job
  # is skipped entirely so we don't fail unrelated builds.
  build-android-release:
    name: build android (release apk + aab)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Decode keystore (skip job if signing secrets absent)
        id: keystore
        working-directory: ${{ github.workspace }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::notice::Android signing secret(s) not configured:$missing — skipping signed release build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stealth-release.jks"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$RUNNER_TEMP/stealth-release.jks" >> "$GITHUB_OUTPUT"

      - name: Write key.properties from secrets
        if: steps.keystore.outputs.skip != 'true'
        working-directory: ${{ github.workspace }}
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s\n' \
            'storeFile=${{ steps.keystore.outputs.keystore_path }}' \
            "storePassword=${STORE_PASSWORD}" \
            "keyAlias=${KEY_ALIAS}" \
            "keyPassword=${KEY_PASSWORD}" \
            > client/android/key.properties

      - name: flutter pub get
        if: steps.keystore.outputs.skip != 'true'
        run: flutter pub get

      - name: flutter build apk --release
        if: steps.keystore.outputs.skip != 'true'
        run: flutter build apk --release

      - name: flutter build appbundle --release
        if: steps.keystore.outputs.skip != 'true'
        run: flutter build appbundle --release

      - name: Upload release artifacts
        if: steps.keystore.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            client/build/app/outputs/flutter-apk/app-release.apk
            client/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  # Task #13: macOS-side analyze + test. Catches macOS-specific path /
  # case sensitivity issues without slowing every PR. On-demand or
  # nightly (04:00 UTC) only.
  analyze-macos:
    name: analyze + test (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  pw-test-e2e:
    name: pw-test E2E (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-web
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.event.pusher.name != 'github-actions[bot]')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build web --release
        run: flutter build web --release

      - name: Install Playwright
        working-directory: ${{ github.workspace }}/pw-test
        run: |
          npm install
          npx playwright install chromium

      - name: Start web static server + run E2E
        working-directory: ${{ github.workspace }}/pw-test
        env:
          STEALTH_WEB_PORT: "57575"
        run: |
          node serve-static-web.mjs &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:57575 > /dev/null 2>&1; then
              echo "Web server ready"
              break
            fi
            sleep 1
          done
          STEALTH_WEB_URL=http://127.0.0.1:57575 \
          node scenarios/chat-basic.mjs || true
          STEALTH_WEB_URL=http://127.0.0.1:57575 \
          node scenarios/call-basic.mjs || true
          STEALTH_WEB_URL=http://127.0.0.1:57575 \
          node scenarios/registration.mjs || true
          kill $SERVER_PID 2>/dev/null || true
