org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
android.enableJetifier=true
# Lint is now configured in app/build.gradle.kts (`lint { ... }` block)
# with a baseline-based workflow. The legacy `android.lintOptions.*`
# overrides used to disable lint entirely; they are intentionally
# removed so the per-module Gradle config wins.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.daemon.jvm.options=-Xmx2G
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
