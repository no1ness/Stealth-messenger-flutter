<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!--
    Content Security Policy
    -----------------------
    Defence-in-depth against script injection (XSS) and clickjacking.

    - script-src 'self'          — only first-party JS (no inline, no CDNs).
                                   Flutter web bootstrap is self-hosted at
                                   `flutter_bootstrap.js`.
    - style-src 'self' 'unsafe-inline'
                                  — inline `<style>` below is the splash
                                    loader. Removing the 'unsafe-inline'
                                    fallback requires extracting that block
                                    into an external `loading.css`
                                    (tracked as a follow-up, see
                                    `.ai-factory/plans/hardening-di-secure-storage.md`
                                    Task 7.3).
    - img-src 'self' data:        — Flutter inlines small assets as data:
                                    URIs (icons, etc.).
    - connect-src 'self' wss: https:
                                  — PocketBase HTTPS + SSE plus future TURN
                                    over wss:. Tighten to a specific origin
                                    once the deployment URL is stable.
    - object-src 'none'
      base-uri 'self'
      frame-ancestors 'none'      — generic XSS / clickjacking hardening.

    Anything outside this list is blocked by the browser, so a stray
    `<script src="…">` injected via a future bug fails closed.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' data:;
                 connect-src 'self' wss: https:;
                 object-src 'none';
                 base-uri 'self';
                 frame-ancestors 'none';">

  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Stealth Messenger - Secure encrypted messaging">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Stealth">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Stealth Messenger</title>
  <link rel="manifest" href="manifest.json">

  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .loader {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border-top: 16px solid #3498db;
      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
    }

    @-webkit-keyframes spin {
      0% { -webkit-transform: rotate(0deg); }
      100% { -webkit-transform: rotate(360deg); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading_indicator" class="loading">
    <div class="loader"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
